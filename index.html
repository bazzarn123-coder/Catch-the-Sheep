<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Catch the Sheep</title>
  
  <!-- Favicon for Browser Address Bar / Tab -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 45'><rect x='15' y='30' width='4' height='10' fill='%23222'/><rect x='43' y='30' width='4' height='10' fill='%23222'/><circle cx='20' cy='20' r='12' fill='%23fff'/><circle cx='30' cy='16' r='14' fill='%23fff'/><circle cx='40' cy='20' r='12' fill='%23fff'/><circle cx='30' cy='24' r='12' fill='%23fff'/><ellipse cx='12' cy='18' rx='7' ry='9' fill='%23333'/><circle cx='10' cy='16' r='1.5' fill='%23fff'/></svg>">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 55%, #5c9335 55%, #477428 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      touch-action: manipulation;
      position: relative;
    }

    /* Scoreboard UI */
    #ui {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px 20px;
      border-radius: 20px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      z-index: 10;
      backdrop-filter: blur(4px);
    }

    /* Overlay Screen with sheep.jpg background */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('sheep.jpg') no-repeat center center;
      background-size: cover;
      z-index: 20;
    }

    /* Modal Text Content */
    .modal-content {
      position: absolute;
      top: 32%;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      text-align: center;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
      width: 90%;
    }

    .modal-content h1 {
      font-size: 36px;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .modal-content p {
      font-size: 24px;
      font-weight: bold;
      color: #ffeb3b;
    }

    /* Button positioned under the sheep feet area */
    .btn {
      position: absolute;
      bottom: 12%;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 45px;
      font-size: 22px;
      font-weight: bold;
      color: white;
      background: #ff5722;
      border: none;
      border-radius: 35px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
      transition: transform 0.1s, background 0.2s;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .btn:active {
      transform: translateX(-50%) scale(0.95);
    }

    /* Background Scenery: Trees, Barn & Fence */
    .scenery {
      position: absolute;
      top: 55%;
      left: 0;
      width: 100%;
      height: 45%;
      pointer-events: none;
      z-index: 1;
    }

    /* Fluffy Trees in the Background */
    .trees-background {
      position: absolute;
      top: -28px;
      left: 0;
      width: 100%;
      height: 45px;
      z-index: 0;
      display: flex;
      justify-content: space-around;
      opacity: 0.85;
    }

    .fluffy-tree {
      position: relative;
      width: 90px;
      height: 40px;
    }

    .fluffy-tree::before, .fluffy-tree::after, .tree-center {
      content: '';
      position: absolute.value;
      background: #2e6f40;
      border-radius: 50%;
    }

    .fluffy-tree .blob1 {
      position: absolute;
      width: 45px;
      height: 35px;
      background: #347d48;
      border-radius: 50%;
      bottom: 0;
      left: 5px;
    }

    .fluffy-tree .blob2 {
      position: absolute;
      width: 55px;
      height: 42px;
      background: #3b8a51;
      border-radius: 50%;
      bottom: 4px;
      left: 25px;
    }

    .fluffy-tree .blob3 {
      position: absolute;
      width: 40px;
      height: 32px;
      background: #2b6338;
      border-radius: 50%;
      bottom: 0;
      right: 5px;
    }

    /* Barn Positioned on the Right, Foot Resting Right at the Fence Line */
    .barn-container {
      position: absolute;
      right: 5%;
      top: -110px;
      width: 200px;
      height: 135px;
      z-index: 1;
    }

    /* Fence Running Across in Front */
    .fence {
      position: absolute;
      top: 12px;
      left: 0;
      width: 100%;
      height: 30px;
      z-index: 2;
      background: repeating-linear-gradient(
        90deg,
        transparent,
        transparent 35px,
        #8b4513 35px,
        #8b4513 42px
      );
    }

    .fence::after {
      content: '';
      position: absolute;
      top: 6px;
      left: 0;
      width: 100%;
      height: 5px;
      background: #a0522d;
      box-shadow: 0 10px 0 #a0522d;
    }

    /* Background Sky Animations */
    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50px;
      pointer-events: none;
      animation: floatCloud linear infinite;
      z-index: 2;
    }

    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
    }

    .cloud::before {
      width: 50px;
      height: 50px;
      top: -20px;
      left: 15px;
    }

    .cloud::after {
      width: 35px;
      height: 35px;
      top: -12px;
      right: 15px;
    }

    @keyframes floatCloud {
      from { left: -150px; }
      to { left: 100vw; }
    }

    .bird {
      position: absolute;
      width: 25px;
      height: 15px;
      pointer-events: none;
      animation: flyBird linear infinite;
      z-index: 2;
    }

    @keyframes flyBird {
      from { left: -40px; }
      to { left: 100vw; }
    }

    .bird svg {
      animation: flap 0.3s ease-in-out infinite alternate;
    }

    @keyframes flap {
      0% { transform: scaleY(1); }
      100% { transform: scaleY(0.4); }
    }

    /* Sheep Styles */
    .sheep {
      position: absolute;
      width: 45px;
      height: 35px;
      cursor: pointer;
      animation: fadeInOut 2.5s linear forwards;
      pointer-events: auto;
      z-index: 5;
    }

    @keyframes fadeInOut {
      0% {
        opacity: 0;
        transform: scale(0.3);
      }
      15% {
        opacity: 1;
        transform: scale(1);
      }
      75% {
        opacity: 1;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(0.5);
      }
    }

    /* SVG Elements */
    .sheep-body {
      fill: #ffffff;
      filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.2));
    }

    .sheep-head {
      fill: #333333;
    }

    .sheep-eye {
      fill: #ffffff;
    }

    /* Pop Effect on Tap */
    .pop {
      position: absolute;
      pointer-events: none;
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      animation: popUp 0.4s ease-out forwards;
      z-index: 15;
    }

    @keyframes popUp {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -80%) scale(1.5);
      }
    }
  </style>
</head>
<body>

  <!-- Sky Decorations -->
  <div class="cloud" style="width: 100px; height: 35px; top: 8%; animation-duration: 35s; animation-delay: 0s;"></div>
  <div class="cloud" style="width: 140px; height: 45px; top: 18%; animation-duration: 48s; animation-delay: -15s;"></div>
  <div class="cloud" style="width: 90px; height: 30px; top: 30%; animation-duration: 28s; animation-delay: -8s;"></div>

  <div class="bird" style="top: 12%; animation-duration: 12s; animation-delay: 0s;">
    <svg viewBox="0 0 30 20"><path d="M 0,10 Q 7,0 15,10 Q 23,0 30,10" stroke="#333" stroke-width="3" fill="none"/></svg>
  </div>
  <div class="bird" style="top: 22%; animation-duration: 16s; animation-delay: -5s;">
    <svg viewBox="0 0 30 20"><path d="M 0,10 Q 7,0 15,10 Q 23,0 30,10" stroke="#333" stroke-width="3" fill="none"/></svg>
  </div>

  <!-- Background Scenery -->
  <div class="scenery">
    <!-- Fluffy Background Trees -->
    <div class="trees-background">
      <div class="fluffy-tree"><div class="blob1"></div><div class="blob2"></div><div class="blob3"></div></div>
      <div class="fluffy-tree"><div class="blob1"></div><div class="blob2"></div><div class="blob3"></div></div>
      <div class="fluffy-tree"><div class="blob1"></div><div class="blob2"></div><div class="blob3"></div></div>
      <div class="fluffy-tree"><div class="blob1"></div><div class="blob2"></div><div class="blob3"></div></div>
      <div class="fluffy-tree"><div class="blob1"></div><div class="blob2"></div><div class="blob3"></div></div>
      <div class="fluffy-tree"><div class="blob1"></div><div class="blob2"></div><div class="blob3"></div></div>
      <div class="fluffy-tree"><div class="blob1"></div><div class="blob2"></div><div class="blob3"></div></div>
      <div class="fluffy-tree"><div class="blob1"></div><div class="blob2"></div><div class="blob3"></div></div>
    </div>

    <div class="barn-container">
      <svg viewBox="0 0 240 160" width="100%" height="100%">
        <!-- Right Extension Roof -->
        <polygon points="160,75 200,45 240,75" fill="#8b0000" />
        <!-- Right Extension Body -->
        <rect x="160" y="75" width="80" height="85" fill="#b22222" />
        <!-- Main Roof -->
        <polygon points="30,55 120,5 210,55" fill="#8b0000" />
        <!-- Main Body -->
        <rect x="30" y="55" width="160" height="105" fill="#b22222" />
        <!-- Loft Vent -->
        <rect x="110" y="25" width="20" height="22" fill="#fff" rx="2" />
        <line x1="113" y1="29" x2="127" y2="29" stroke="#b22222" stroke-width="2"/>
        <line x1="113" y1="33" x2="127" y2="33" stroke="#b22222" stroke-width="2"/>
        <line x1="113" y1="37" x2="127" y2="37" stroke="#b22222" stroke-width="2"/>
        <line x1="113" y1="41" x2="127" y2="41" stroke="#b22222" stroke-width="2"/>
        <!-- Left Windows -->
        <rect x="52" y="72" width="14" height="16" fill="#fff" stroke="#8b0000" stroke-width="2" />
        <rect x="52" y="105" width="14" height="16" fill="#fff" stroke="#8b0000" stroke-width="2" />
        <!-- Right Windows -->
        <rect x="154" y="72" width="14" height="16" fill="#fff" stroke="#8b0000" stroke-width="2" />
        <rect x="154" y="105" width="14" height="16" fill="#fff" stroke="#8b0000" stroke-width="2" />
        <!-- Extension Window -->
        <rect x="190" y="95" width="16" height="16" fill="#fff" stroke="#8b0000" stroke-width="2" />
        <line x1="198" y1="95" x2="198" y2="111" stroke="#8b0000" stroke-width="2"/>
        <line x1="190" y1="103" x2="206" y2="103" stroke="#8b0000" stroke-width="2"/>
        <!-- Hay Interior Shadow & Hay -->
        <rect x="100" y="95" width="40" height="65" fill="#2a0808" />
        <path d="M 100,140 Q 115,130 140,145 L 140,160 L 100,160 Z" fill="#d4ac0d" />
        <!-- Large White Double Doors with Cross-Bracing -->
        <rect x="100" y="95" width="40" height="65" fill="none" stroke="#fff" stroke-width="4" />
        <line x1="120" y1="95" x2="120" y2="160" stroke="#fff" stroke-width="3" />
        <line x1="100" y1="95" x2="120" y2="135" stroke="#fff" stroke-width="3" />
        <line x1="140" y1="95" x2="120" y2="135" stroke="#fff" stroke-width="3" />
      </svg>
    </div>
    <div class="fence"></div>
  </div>

  <div id="ui">
    <div>Score: <span id="score">0</span></div>
    <div>Missed: <span id="missed">0</span>/10</div>
    <div>Level: <span id="level-display">1</span></div>
  </div>

  <!-- Splash Screen / Game Over Modal -->
  <div id="modal-screen" class="modal-overlay">
    <div class="modal-content">
      <h1 id="modal-title"></h1>
      <p id="modal-score-display" style="display: none;"></p>
    </div>
    <button class="btn" onclick="startGame()">Play Game</button>
  </div>

  <script>
    let score = 0;
    let missed = 0;
    const maxMissed = 10;
    let level = 1;
    let gameInterval;
    let isPlaying = false;
    let spawnRate = 800;

    const scoreEl = document.getElementById('score');
    const missedEl = document.getElementById('missed');
    const levelDisplayEl = document.getElementById('level-display');
    const modalScreen = document.getElementById('modal-screen');
    const modalTitle = document.getElementById('modal-title');
    const modalScoreDisplay = document.getElementById('modal-score-display');
    const playBtn = modalScreen.querySelector('.btn');

    const sheepSvg = `
      <svg viewBox="0 0 60 45" width="100%" height="100%">
        <!-- Legs -->
        <rect x="15" y="30" width="4" height="10" rx="2" fill="#222" />
        <rect x="23" y="30" width="4" height="10" rx="2" fill="#222" />
        <rect x="35" y="30" width="4" height="10" rx="2" fill="#222" />
        <rect x="43" y="30" width="4" height="10" rx="2" fill="#222" />
        <!-- Fluffy Body -->
        <circle cx="20" cy="20" r="12" class="sheep-body" />
        <circle cx="30" cy="16" r="14" class="sheep-body" />
        <circle cx="40" cy="20" r="12" class="sheep-body" />
        <circle cx="30" cy="24" r="12" class="sheep-body" />
        <!-- Head -->
        <ellipse cx="12" cy="18" rx="7" ry="9" class="sheep-head" />
        <!-- Ears -->
        <ellipse cx="16" cy="12" rx="4" ry="2" class="sheep-head" transform="rotate(-20 16 12)" />
        <!-- Eye -->
        <circle cx="10" cy="16" r="1.5" class="sheep-eye" />
      </svg>
    `;

    function startGame() {
      if (playBtn.textContent === 'Play Again' || playBtn.textContent.includes('Level')) {
        if (playBtn.textContent === 'Play Again') {
          score = 0;
          missed = 0;
          level = 1;
          spawnRate = 800;
        }
      } else {
        score = 0;
        missed = 0;
        level = 1;
        spawnRate = 800;
      }

      isPlaying = true;
      scoreEl.textContent = score;
      missedEl.textContent = missed;
      levelDisplayEl.textContent = level;

      document.querySelectorAll('.sheep').forEach(s => s.remove());
      modalScreen.style.display = 'none';

      clearInterval(gameInterval);
      gameInterval = setInterval(spawnSheep, spawnRate);
    }

    function showLevelUpModal(nextLevel) {
      isPlaying = false;
      clearInterval(gameInterval);

      modalTitle.textContent = `Level ${nextLevel}`;
      modalScoreDisplay.style.display = 'none';
      playBtn.textContent = `Start Level ${nextLevel}`;
      modalScreen.style.display = 'block';
    }

    function spawnSheep() {
      if (!isPlaying) return;

      const sheep = document.createElement('div');
      sheep.className = 'sheep';
      sheep.innerHTML = sheepSvg;

      const paddingX = 40;
      const groundTop = window.innerHeight * 0.58;
      const groundBottom = window.innerHeight - 50;

      const x = Math.random() * (window.innerWidth - paddingX * 2) + paddingX;
      const y = Math.random() * (groundBottom - groundTop) + groundTop;

      sheep.style.left = `${x}px`;
      sheep.style.top = `${y}px`;

      if (Math.random() > 0.5) {
        sheep.style.transform = 'scaleX(-1)';
      }

      const tapHandler = (e) => {
        e.preventDefault();
        e.stopPropagation();

        if (!isPlaying) return;

        score += 10;
        scoreEl.textContent = score;

        createPopEffect(x, y);
        sheep.remove();

        if (score > 0 && score % 500 === 0) {
          level++;
          showLevelUpModal(level);
          return;
        }
      };

      sheep.addEventListener('touchstart', tapHandler, { passive: false });
      sheep.addEventListener('mousedown', tapHandler);

      sheep.addEventListener('animationend', () => {
        if (document.body.contains(sheep)) {
          sheep.remove();
          missed++;
          missedEl.textContent = missed;

          if (missed >= maxMissed) {
            endGame();
          }
        }
      });

      document.body.appendChild(sheep);
    }

    function createPopEffect(x, y) {
      const pop = document.createElement('div');
      pop.className = 'pop';
      pop.textContent = '+10';
      pop.style.left = `${x}px`;
      pop.style.top = `${y}px`;
      document.body.appendChild(pop);

      setTimeout(() => pop.remove(), 400);
    }

    function endGame() {
      isPlaying = false;
      clearInterval(gameInterval);

      modalTitle.textContent = 'Game Over';
      modalScoreDisplay.textContent = `Final Score: ${score}`;
      modalScoreDisplay.style.display = 'block';
      playBtn.textContent = 'Play Again';
      modalScreen.style.display = 'block';
    }
  </script>
</body>
</html>
